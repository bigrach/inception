events {}

http {
    server {
        listen 80;
            server_name localhost;
        return 403;
    }
    server {
        listen 443 ssl;
        server_name localhost;
        server_name $DOMAIN;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;


    }
}
