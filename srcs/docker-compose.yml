volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts: 
      device: $MDB_VOLUME
      o: bind
      type: none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: $WP_VOLUME
      o: bind
      type: none


services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes: 
      - mariadb:/var/lib/mysql 
    env_file: 
      - .env
#    secrets:
#      - bd_secrets
    expose: 
      - $MDB_PORT
    networks:
      - inception
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p$${MDB_ADMIN_PASSWORD}"]
      interval: 5s
      timeout: 2s
      retries: 5

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    networks:
      - inception
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
      - "80:80"
    volumes: 
      - wordpress:/var/www/html 
    depends_on:
      - wordpress
    env_file: 
      - .env
#    secrets:
#      - nginx_secrets
    expose:
      - $NGINX_PORT
    restart: on-failure

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on: 
      - mariadb
    networks: 
      - inception
    volumes: 
      - wordpress:/var/www/html 
    env_file: 
      - .env
#    secrets:
#      - wp_secrets
    expose:
      - $WP_PORT
    restart: on-failure


networks:
  inception:
    name: inception

