volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts: 
      device: /home/me/data/mariadb
      o: bind
      type: none

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes: 
      - mariadb:/var/lib/mysql 
    env_file: 
      - .env
    expose: 
      - "3306"
    networks:
      - inception
  nginx:
    build: ./requirements/nginx
    networks:
      - inception
    ports:
      - "443:443"
      - "80:80"


networks:
  inception:
    name: inception
