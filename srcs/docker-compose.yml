volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts: 
      device: $MDB_VOLUME
      o: bind
      type: none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: $WP_VOLUME
      o: bind
      type: none


services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes: 
      - mariadb:/var/lib/mysql 
    env_file: 
      - .env
    secrets:
      - MDB_USER_PASSWORD
      - MDB_ROOT_PASSWORD
    expose: 
      - $MDB_PORT
    networks:
      - inception
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -P $${MDB_PORT} -u $${MDB_USER} -p\"$$(cat /run/secrets/MDB_USER_PASSWORD)\" --silent"]
      interval: 5s
      timeout: 2s
      retries: 5

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    networks:
      - inception
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
      - "80:80"
    volumes: 
      - wordpress:/var/www/html 
    depends_on:
      - wordpress
    env_file: 
      - .env
    expose:
      - $NGINX_PORT
    restart: on-failure

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on: 
      - mariadb
    networks: 
      - inception
    volumes: 
      - wordpress:/var/www/html 
    env_file: 
      - .env
    secrets:
      - WP_USER_PASSWORD
      - WP_ADMIN_PASSWORD
      - MDB_USER_PASSWORD
    expose:
      - $WP_PORT
    restart: on-failure


networks:
  inception:
    name: inception

secrets:
  WP_USER_PASSWORD:
    file: ./secrets/wp_user_pwd.txt
  WP_ADMIN_PASSWORD:
    file: ./secrets/wp_admn_pwd.txt
  MDB_USER_PASSWORD:
    file: ./secrets/mdb_user_pwd.txt
  MDB_ROOT_PASSWORD:
    file: ./secrets/mdb_root_pwd.txt
