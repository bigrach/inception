volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts: 
      device: /home/me/data/mariadb
      o: bind
      type: none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: /home/me/data/wordpress
      o: bind
      type: none

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    volumes: 
      - mariadb:/var/lib/mysql 
    env_file: 
      - .env
#    secrets:
#      - bd_secrets
    expose: 
      - $MDB_PORT
    networks:
      - inception
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    networks:
      - inception
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
      - "80:80"
    volumes: 
      - wordpress:/var/www/html 
    depends_on:
      - wordpress
    env_file: 
      - .env
    expose:
      - $NGINX_PORT
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    depends_on: 
      - mariadb
    networks: 
      - inception
    volumes: 
      - wordpress:/var/www/html 
    env_file: 
      - .env
    expose:
      - $WP_PORT

networks:
  inception:
    name: inception

